<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Respiratory Mid — Study Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: calc(20px + env(safe-area-inset-top)) 18px 48px;
      max-width: 720px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .back-btn {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sync-pill {
      font-size: 0.8rem;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
    h1 { font-size: 1.55rem; font-weight: 700; margin-bottom: 6px; }
    .meta { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; }

    .progress-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .progress-bar {
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.25s ease;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .reset-btn:hover { border-color: var(--danger); color: var(--danger); }

    .day-group { margin-bottom: 18px; }
    .day-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .lec-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
      transition: border-color 0.15s ease, opacity 0.15s ease;
    }
    .lec-item.done { opacity: 0.65; border-color: rgba(34, 197, 94, 0.4); }
    .lec-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }
    .lec-title {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.98rem;
      outline: none;
    }
    .lec-item.done .lec-title { text-decoration: line-through; color: var(--muted); }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-btn">← Study Hub</a>
    <div class="sync-pill"><span id="dot" class="dot"></span><span id="status">Syncing...</span></div>
  </div>

  <h1>Respiratory Mid — Study Tracker</h1>
  <div class="meta">Exam: Sunday, Dec 6, 2026 · 20 lectures · 10 days</div>

  <div class="progress-card">
    <div class="progress-header">
      <span>Overall progress</span>
      <span id="progressText" style="color: var(--green);">0/20 lectures</span>
    </div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <button id="resetBtn" class="reset-btn">Reset progress</button>
  </div>

  <div id="list"></div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyCxtO8FdhPF-4qacnMIOtzCRP30KeZ3sYo",
      authDomain: "://firebaseapp.com",
      projectId: "uni-study-tracker-58dd0",
      storageBucket: "uni-study-tracker-58dd0.firebasestorage.app",
      messagingSenderId: "16736564692",
      appId: "1:16736564692:web:8c8300a0833c790d84d241"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const trackerRef = doc(db, "studyData", "tracker");

    const TOTAL = 20;
    let state = { checked: {}, titles: {} };

    const listEl = document.getElementById("list");
    for (let day = 1; day <= 10; day++) {
      const group = document.createElement("div");
      group.className = "day-group";
      group.innerHTML = `<div class="day-label">Day ${day}</div>`;

      for (let slot = 0; slot < 2; slot++) {
        const num = (day - 1) * 2 + slot + 1;
        const key = `lec_${num}`;
        const row = document.createElement("div");
        row.className = "lec-item";
        row.id = `row_${key}`;
        row.innerHTML = `
          <input type="checkbox" id="chk_${key}" />
          <input type="text" class="lec-title" id="txt_${key}" value="Lecture ${num}" aria-label="Lecture ${num}" />
        `;
        group.appendChild(row);
      }
      listEl.appendChild(group);
    }

    function render() {
      let doneCount = 0;
      for (let i = 1; i <= TOTAL; i++) {
        const key = `lec_${i}`;
        const isChecked = Boolean(state.checked[key]);
        if (isChecked) doneCount++;

        const chk = document.getElementById(`chk_${key}`);
        const txt = document.getElementById(`txt_${key}`);
        const row = document.getElementById(`row_${key}`);

        chk.checked = isChecked;
        row.classList.toggle("done", isChecked);
        if (document.activeElement !== txt) {
          txt.value = state.titles[key] || `Lecture ${i}`;
        }
      }
      document.getElementById("progressText").textContent = `${doneCount}/${TOTAL} lectures`;
      document.getElementById("progressFill").style.width = `${Math.round((doneCount / TOTAL) * 100)}%`;
    }

    async function save() {
      await setDoc(trackerRef, { checked: state.checked, titles: state.titles, total: TOTAL }, { merge: true });
    }

    onSnapshot(trackerRef, (snap) => {
      document.getElementById("dot").classList.add("live");
      document.getElementById("status").textContent = "Synced";
      if (snap.exists()) {
        const data = snap.data();
        state.checked = data.checked || {};
        state.titles = data.titles || {};
      }
      render();
    }, () => {
      document.getElementById("status").textContent = "Offline";
    });

    listEl.addEventListener("change", (e) => {
      if (e.target.type === "checkbox") {
        const key = e.target.id.replace("chk_", "");
        state.checked[key] = e.target.checked;
        render();
        save();
      } else if (e.target.classList.contains("lec-title")) {
        const key = e.target.id.replace("txt_", "");
        state.titles[key] = e.target.value;
        save();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Reset all 20 lectures?")) {
        state.checked = {};
        render();
        save();
      }
    });
  </script>
</body>
</html>
