<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>Study Hub Workspace</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png?v=3" />
<link rel="icon" type="image/png" href="icon.png?v=3" />
<style>
:root{--bg:#060911;--card:#111827;--card2:#1e293b;--border:#334155;--text:#ffffff;--muted:#94a3b8;--accent:#38bdf8;--green:#22c55e;--amber:#fbbf24;--shadow:0 8px 24px rgba(0,0,0,.45);}
:root.light{--bg:#eef2f6;--card:#ffffff;--card2:#f1f5f9;--border:#cbd5e1;--text:#090d16;--muted:#475569;--accent:#0284c7;--green:#16a34a;--amber:#d97706;--shadow:0 4px 14px rgba(15,23,42,.08);}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;}
body{background:var(--bg);color:var(--text);padding:calc(16px + env(safe-area-inset-top)) 16px 80px;max-width:900px;margin:0 auto;transition:background .2s,color .2s;}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.brand h1{font-size:1.18rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.vtag{font-size:.68rem;background:rgba(56,189,248,.16);color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:6px;}
.brand p{font-size:.75rem;color:var(--muted);margin-top:2px;}
.tcontrols{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.stat-pill{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);padding:5px 12px;border-radius:999px;font-size:.76rem;font-weight:700;box-shadow:var(--shadow);}
.ring-wrap{display:flex;align-items:center;gap:6px;}
.tbtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:999px;font-size:.76rem;font-weight:700;cursor:pointer;}
.tbtn.blue{background:var(--accent);color:#060911;border-color:var(--accent);}
:root.light .tbtn.blue{color:#fff;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green);}
.nav-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
.nav-bar::-webkit-scrollbar{display:none;}
.nav-pill{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:11px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.nav-pill.active{background:var(--accent);color:#060911;border-color:var(--accent);}
:root.light .nav-pill.active{color:#fff;}
.search-in{width:100%;background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-size:.88rem;margin-bottom:12px;}
.search-res{background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:8px;margin:-6px 0 12px;display:none;box-shadow:var(--shadow);}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;min-width:144px;cursor:pointer;box-shadow:var(--shadow);}
.chip.past{opacity:.45;}
.cdays{font-size:1.02rem;font-weight:800;}
.cname{font-size:.8rem;font-weight:700;margin-top:2px;}
.cdate{font-size:.72rem;color:var(--muted);}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sec-h h2{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.mcard{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;}
.mcard:hover{transform:translateY(-2px);}
.bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin:10px 0 8px;}
.fill{height:100%;transition:width .25s;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;}
.tab{background:var(--card);border:1.5px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.tab.on{color:#fff;}
.lec-card{border:1.5px solid var(--sc);background:linear-gradient(135deg,var(--sc-bg),var(--card) 55%);border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
.lec-card.done{opacity:.72;}
.main-chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--sc);display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;cursor:pointer;flex-shrink:0;color:#fff;}
.main-chk.on{background:var(--sc);}
.num-pill{font-size:.7rem;font-weight:800;color:var(--sc);background:var(--sc-bg);border:1px solid var(--sc);padding:2px 7px;border-radius:6px;}
.subj-pill{font-size:.7rem;font-weight:800;color:#fff;background:var(--sc);padding:2px 8px;border-radius:6px;}
.passes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px;}
.pbox{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card2);border:1.5px solid var(--border);border-radius:9px;padding:6px 4px;font-size:.74rem;font-weight:700;cursor:pointer;user-select:none;}
.pbox.on{background:var(--sc);border-color:var(--sc);color:#fff;}
.star{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);}
.star.on{color:var(--amber);}
.grp-box{border:1.5px solid var(--sc);border-radius:16px;padding:12px;margin-bottom:14px;background:var(--card);}
.grp-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 2px 10px;color:var(--sc);font-weight:800;font-size:.92rem;}
</style>
</head>

  <div class="brand">

          <path id="goalArc" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round"/>

        <span><b id="goalNum">0/5</b> today</span>
      </div>

    <button class="tbtn" id="themeBtn">☀️ / 🌙</button>

    <button class="tbtn blue" id="expBtn">↓ Backup</button>

</div>

  document.getElementById("cdStrip").innerHTML = EXAMS.map(e => {
    const m = MODS.find(x=>x.id===e.mod); const ms = new Date(e.date).getTime() - now; const d = Math.ceil(ms / 86400000);
    return `<div class="chip ${ms<=0?'past':''}" style="border-top:3px solid ${m.color}" onclick="openMod('${e.mod}','${e.tab}')"><div class="cdays" style="color:${m.color}">${ms<=0?'Done':d+'d left'}</div><div class="cname">${e.name}</div><div class="cdate">${e.label}</div></div>`;
  }).join("");
}
function renderModCards() {
  return MODS.map(m => {
    const its = getItems(m), done = its.filter(it => store.checks[it.id+"_p1"]).length, left = its.length - done;
    const pace = its.length ? (left / daysTo(m.exam)).toFixed(1) : "0.0", pct = its.length ? Math.round((done/its.length)*100) : 0;
    return `<div class="mcard" style="border-top:4px solid ${m.color}" onclick="openMod('${m.id}','${m.id==='mod_res'?'mid':'lec'}')">
      <div style="display:flex;justify-content:space-between;align-items:center;"><span style="background:${m.color};color:#fff;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:6px;">${m.code}</span><span style="font-size:.76rem;color:${m.color};font-weight:800;">⚡ ${pace}/day</span></div>
      <h3 style="font-size:1.08rem;margin:8px 0 3px;">${m.name}</h3>
      <div style="font-size:.78rem;color:var(--muted);">${m.sub}</div>
      <div class="bar"><div class="fill" style="width:${pct}%;background:${m.color}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.8rem;font-weight:800;"><span style="color:var(--green);">✅ ${done} Finished</span><span>⏳ ${left} Left (${pct}%)</span></div>
    </div>`;
  }).join("");
}

function renderLecRow(it) {
  const p1 = Boolean(store.checks[it.id+"_p1"]);
  const boxes = [["p1","1st Study"],["p2","Rev 1"],["p3","Rev 2"],["p4","Qs"]].map(p => {
    const k = `${it.id}_${p[0]}`, on = Boolean(store.checks[k]);
    return `<div class="pbox ${on?'on':''}" onclick="toggleChk('${k}')">${on?'✓ ':''}${p[1]}</div>`;
  }).join("");
  return `<div class="lec-card ${p1?'done':''}" style="${scStyle(it.dept)}">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="main-chk ${p1?'on':''}" onclick="toggleChk('${it.id}_p1')">${p1?'✓':''}</div>
      <div style="flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;">
        <span class="num-pill">#${it.num}</span><span class="subj-pill">${it.dept}</span>
        <span style="font-size:.92rem;font-weight:700;">${it.text}</span>
      </div>
      <button class="star ${store.stars[it.id]?'on':''}" onclick="toggleStar('${it.id}')">★</button>
    </div>
    <div class="passes">${boxes}</div>
  </div>`;
}
function render() {
  renderNav(); renderStrip();
  const root = document.getElementById("viewRoot");
  const todayStr = new Date().toISOString().slice(0,10);
  const doneToday = Object.values(store.checks).filter(v => v === todayStr).length + Object.values(store.mid).filter(v => v === todayStr).length;
  document.getElementById("goalNum").textContent = `${doneToday}/5`;
  document.getElementById("goalArc").setAttribute("stroke-dasharray", `${Math.min(100, doneToday*20)}, 100`);

  if (viewMode === "home") {
    const dueMid = [], weak = [];
    RES_MID.forEach((d,di) => d.items.forEach((it,ii) => { const k=`d${di}-i${ii}`; if(!store.mid[k] && dueMid.length<3) dueMid.push({k,d:it.d,t:it.t}); }));
    MODS.forEach(m => getItems(m).forEach(it => { if(store.stars[it.id] && weak.length<3) weak.push({mod:m.id,d:it.dept,t:`#${it.num} ${it.text}`,code:m.code}); }));
    root.innerHTML = `<div class="card"><div class="sec-h"><h2>🎯 Smart Today's Plan</h2><span class="subj-pill" style="--sc:#38bdf8">Auto-Curated</span></div>
      ${dueMid.map(x=>`<div class="lec-card" style="${scStyle(x.d)};display:flex;align-items:center;gap:10px;"><input type="checkbox" style="width:18px;height:18px;" onchange="toggleMid('${x.k}')"><span class="subj-pill">RES Mid · ${x.d}</span><span style="font-size:.88rem;font-weight:700;">${x.t}</span></div>`).join("")}
      ${weak.map(x=>`<div class="lec-card" onclick="openMod('${x.mod}','lec')" style="${scStyle(x.d)};cursor:pointer;display:flex;align-items:center;gap:8px;"><span style="color:var(--amber);font-size:1.1rem;">★</span><span class="subj-pill">${x.code} · ${x.d}</span><span style="font-size:.88rem;font-weight:700;">${x.t}</span></div>`).join("")}
      ${(!dueMid.length && !weak.length)?'<p style="font-size:.86rem;color:var(--muted);">All caught up for today! Pick any module below.</p>':''}
    </div><div class="sec-h"><h2>Modules (Separate Tracking)</h2></div><div class="grid">${renderModCards()}</div>`;
    return;
  }

  if (viewMode === "modules") { root.innerHTML = `<div class="sec-h"><h2>All Semester Modules</h2></div><div class="grid">${renderModCards()}</div>`; return; }

  const m = MODS.find(x => x.id === curMod), its = getItems(m);
  const done = its.filter(it => store.checks[it.id+"_p1"]).length, left = its.length - done;
  const pace = its.length ? (left / daysTo(m.exam)).toFixed(1) : "0.0";

  let modTabs = `<button class="tab ${curTab==='lec'?'on':''}" style="${curTab==='lec'?`background:${m.color};border-color:${m.color};`:''}" onclick="setTab('lec')">Finals Lectures (${its.length})</button>`;
  if (m.id === "mod_res") modTabs += `<button class="tab ${curTab==='mid'?'on':''}" style="${curTab==='mid'?`background:${m.color};border-color:${m.color};`:''}" onclick="setTab('mid')">Midterm Plan (21)</button><button class="tab ${curTab==='prac'?'on':''}" style="${curTab==='prac'?`background:${m.color};border-color:${m.color};`:''}" onclick="setTab('prac')">Practical 14-List</button>`;
  modTabs += `<button class="tab ${curTab==='res'?'on':''}" style="${curTab==='res'?`background:${m.color};border-color:${m.color};`:''}" onclick="setTab('res')">Guides, Summaries & PDFs</button>`;
  let bodyHtml = "";
  if (curTab === "lec") {
    const depts = ["All", "Remaining", "Weak ★", ...new Set(its.map(x=>x.dept))];
    const fBar = depts.map(d => `<button class="tab ${filter===d?'on':''}" style="${filter===d?`background:${m.color};border-color:${m.color};`:''}" onclick="setFilter('${d}')">${d}</button>`).join("");
    const shown = its.filter(it => {
      const unf = !store.checks[it.id+"_p1"], wk = Boolean(store.stars[it.id]);
      if (cram && !wk && !unf) return false;
      if (filter === "Remaining") return unf;
      if (filter === "Weak ★") return wk;
      if (filter !== "All") return it.dept === filter;
      return true;
    });
    const listHtml = grouped ? [...new Set(shown.map(x=>x.dept))].map(dept => {
      const subIts = shown.filter(x=>x.dept===dept), sDone = subIts.filter(x=>store.checks[x.id+"_p1"]).length;
      return `<div class="grp-box" style="${scStyle(dept)}"><div class="grp-head" onclick="toggleGrp('${dept}')"><span>${collapsed[dept]?'▸':'▾'} ${dept} Group</span><span>${sDone}/${subIts.length} Done</span></div>${collapsed[dept]?'':subIts.map(renderLecRow).join("")}</div>`;
    }).join("") : shown.map(renderLecRow).join("");

    bodyHtml = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
      <div class="tabs" style="margin:0;flex:1;">${fBar}</div>
      <button class="tbtn ${grouped?'blue':''}" onclick="grouped=!grouped;render()">🗂 Group by Subject</button>
    </div>
    <form onsubmit="addTopic(event)" style="display:flex;gap:6px;margin-bottom:12px;">
      <select id="newDept" style="background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:9px;border-radius:10px;font-size:.84rem;">${Object.keys(SUBJ_COLORS).map(k=>`<option>${k}</option>`).join("")}</select>
      <input id="newTxt" placeholder="Add lecture title..." style="flex:1;background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:9px;border-radius:10px;font-size:.84rem;" required>
      <button class="tbtn blue" type="submit">+ Add</button>
    </form>${listHtml}`;
  } else if (curTab === "mid") {
    bodyHtml = RES_MID.map((d,di) => `<div class="card"><div class="sec-h"><h2>${d.day}</h2></div>${d.items.map((it,ii)=>{
      const k=`d${di}-i${ii}`, on=Boolean(store.mid[k]);
      return `<div class="lec-card ${on?'done':''}" style="${scStyle(it.d)};display:flex;align-items:center;gap:10px;"><input type="checkbox" style="width:18px;height:18px;" ${on?'checked':''} onchange="toggleMid('${k}')"><span class="subj-pill">${it.d}</span><span style="font-size:.9rem;font-weight:700;">${it.t}</span></div>`;
    }).join("")}</div>`).join("");
  } else if (curTab === "prac") {
    bodyHtml = RES_PRAC.map((it,i) => {
      const p1 = Boolean(store.prac[`pr_${i}_p1`]);
      const boxes = [["p1","1st Study"],["p2","Rev 1"],["p3","Rev 2"],["p4","Qs"]].map(p => {
        const k = `pr_${i}_${p[0]}`, on = Boolean(store.prac[k]);
        return `<div class="pbox ${on?'on':''}" onclick="togglePrac('${k}')">${on?'✓ ':''}${p[1]}</div>`;
      }).join("");
      return `<div class="lec-card ${p1?'done':''}" style="${scStyle(it.d)}"><div style="display:flex;align-items:center;gap:10px;"><div class="main-chk ${p1?'on':''}" onclick="togglePrac('pr_${i}_p1')">${p1?'✓':''}</div><span class="num-pill">#P${String(i+1).padStart(2,"0")}</span><span class="subj-pill">${it.d}</span><b style="font-size:.92rem;">${it.t}</b></div><div class="passes">${boxes}</div></div>`;
    }).join("");
  }
  else {
    const autoPdfs = autoFiles[`pdfs/${m.folder}`] || [], autoGuides = autoFiles[`guides/${m.folder}`] || [], savedPdfs = store.pdfs[m.id] || [];
    bodyHtml = `<div class="card"><div class="sec-h"><h2>Interactive HTML Guides</h2></div>
      ${[...m.staticGuides, ...autoGuides].map(g=>`<a href="${g.href}" class="lec-card" style="--sc:${m.color};--sc-bg:rgba(56,189,248,.1);display:block;text-decoration:none;color:${m.color};font-weight:800;">✨ ${g.title} →</a>`).join("") || '<p style="font-size:.84rem;color:var(--muted);">Upload daily HTML guides to <b>guides/'+m.folder+'/</b> on GitHub to appear here automatically.</p>'}
    </div>
    <div class="card"><div class="sec-h"><h2>Original Lecture PDFs</h2></div>
      <form onsubmit="addPdf(event)" style="display:flex;gap:6px;margin-bottom:12px;">
        <input id="pdfTitle" placeholder="PDF Title" style="width:135px;background:var(--card2);border:1.5px solid var(--border);color:var(--text);padding:9px;border-radius:10px;font-size:.84rem;" required>
        <input id="pdfUrl" placeholder="Filename (e.g. ecg.pdf) or Drive link" style="flex:1;background:var(--card2);border:1.5px solid var(--border);color:var(--text);padding:9px;border-radius:10px;font-size:.84rem;" required>
        <button class="tbtn blue" type="submit">+ Link</button>
      </form>
      ${[...autoPdfs, ...savedPdfs].map(p=>`<a href="${p.href}" target="_blank" class="lec-card" style="--sc:${m.color};--sc-bg:rgba(56,189,248,.08);display:block;text-decoration:none;color:var(--text);font-weight:700;">📄 ${p.title} ↗</a>`).join("") || '<p style="font-size:.84rem;color:var(--muted);">Bulk-upload PDFs into <b>pdfs/'+m.folder+'/</b> on GitHub or paste a link above.</p>'}
    </div>`;
  }

  root.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
    <button class="tbtn" onclick="goHome()">← Study Hub</button>
    <button class="tbtn ${cram?'blue':''}" onclick="cram=!cram;render()">⚡ Exam Cram Mode (Weak ★ + Unfinished): ${cram?'ON':'OFF'}</button>
  </div>
  <div class="card" style="border-top:4px solid ${m.color}">
    <div style="display:flex;justify-content:space-between;align-items:center;"><span style="background:${m.color};color:#fff;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:6px;">${m.code}</span><span style="font-size:.82rem;color:${m.color};font-weight:800;">⚡ ${pace} topics/day needed</span></div>
    <h2 style="margin:6px 0 2px;font-size:1.25rem;">${m.name}</h2>
    <p style="font-size:.82rem;color:var(--muted);">${m.sub}</p>
    <div class="bar"><div class="fill" style="width:${its.length?Math.round((done/its.length)*100):0}%;background:${m.color}"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:.84rem;font-weight:800;"><span style="color:var(--green);">✅ ${done} Finished</span><span>⏳ ${left} Left</span></div>
  </div>
  <div class="tabs">${modTabs}</div>${bodyHtml}`;
}

window.goHome = () => { viewMode = "home"; curMod = null; cram = false; render(); };
window.goModules = () => { viewMode = "modules"; curMod = null; cram = false; render(); };
window.openMod = (id, tab) => { viewMode = "mod"; curMod = id; curTab = tab || "lec"; filter = "All"; cram = false; render(); scanRepo(MODS.find(x=>x.id===id).folder); };
window.setTab = (t) => { curTab = t; render(); };
window.setFilter = (f) => { filter = f; render(); };
window.toggleGrp = (d) => { collapsed[d] = !collapsed[d]; render(); };
window.toggleChk = (k) => { store.checks[k] = store.checks[k] ? false : new Date().toISOString().slice(0,10); persist(); };
window.toggleStar = (id) => { store.stars[id] = !store.stars[id]; persist(); };
window.toggleMid = (k) => { store.mid[k] = store.mid[k] ? false : new Date().toISOString().slice(0,10); persist(); };
window.togglePrac = (k) => { store.prac[k] = !store.prac[k]; persist(); };
window.addTopic = (e) => { e.preventDefault(); const m = MODS.find(x=>x.id===curMod); store.custom[m.id] = store.custom[m.id] || []; const num = String(getItems(m).length+1).padStart(2,"0"); store.custom[m.id].push({id:`c_${Date.now()}`,num,dept:document.getElementById("newDept").value,text:document.getElementById("newTxt").value}); persist(); };
window.addPdf = (e) => { e.preventDefault(); store.pdfs[curMod] = store.pdfs[curMod] || []; store.pdfs[curMod].push({title:document.getElementById("pdfTitle").value,href:document.getElementById("pdfUrl").value}); persist(); };

document.getElementById("searchIn").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), box = document.getElementById("searchRes");
  if (!q) { box.style.display = "none"; return; }
  const hits = [];
  MODS.forEach(m => getItems(m).forEach(it => { if ((it.text+it.dept+it.num).toLowerCase().includes(q)) hits.push(`<div style="padding:7px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.84rem;" onclick="openMod('${m.id}','lec')"><b>${m.code} #${it.num}</b> · ${it.text}</div>`); }));
  box.innerHTML = hits.slice(0,8).join("") || '<div style="font-size:.82rem;color:var(--muted);padding:6px;">No matches found</div>';
  box.style.display = "block";
});

document.getElementById("expBtn").onclick = () => { const a = document.createElement("a"); a.href = "data:application/json," + encodeURIComponent(JSON.stringify(store)); a.download = "study-hub-backup.json"; a.click(); };
document.getElementById("impBtn").onclick = () => document.getElementById("impFile").click();
document.getElementById("impFile").onchange = e => { const r = new FileReader(); r.onload = () => { store = JSON.parse(r.result); persist(); }; r.readAsText(e.target.files[0]); };

async function scanRepo(folder) {
  const api = location.protocol + "//" + ["api","github","com"].join(".") + "/repos/omar200008/Uni-Studying/contents/";
  for (const kind of ["pdfs","guides"]) {
    try {
      const res = await fetch(api + kind + "/" + folder);
      if (res.ok) { const arr = await res.json(); autoFiles[`${kind}/${folder}`] = arr.filter(f=>f.type==="file").map(f=>({title:f.name.replace(/\.[^.]+$/,""),href:`${kind}/${folder}/${f.name}`})); render(); }
    } catch(e) {}
  }
}

render();

    firebase.initializeApp({

      authDomain: ["uni-study-tracker-58dd0","firebaseapp","com"].join("."),
      projectId: "uni-study-tracker-58dd0",
      storageBucket: ["uni-study-tracker-58dd0","firebasestorage","app"].join("."),
      messagingSenderId: "16736564692",

</script>
