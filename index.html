<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Study Hub Workspace</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png?v=3" />
<link rel="icon" type="image/png" href="icon.png?v=3" />
<style>
:root{--bg:#090d16;--card:#131b2e;--card2:#1a243d;--border:#24314d;--text:#f8fafc;--muted:#8b9bb4;--accent:#38bdf8;--green:#22c55e;--amber:#f59e0b;}
:root.light{--bg:#f4f6f9;--card:#ffffff;--card2:#eef2f7;--border:#dce3ec;--text:#0f172a;--muted:#5b6b7a;--accent:#2563eb;--green:#16a34a;--amber:#d97706;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;}
body{background:var(--bg);color:var(--text);padding:calc(16px + env(safe-area-inset-top)) 16px 70px;max-width:860px;margin:0 auto;transition:background .2s,color .2s;}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;}
.vtag{font-size:.68rem;background:rgba(56,189,248,.16);color:var(--accent);padding:2px 7px;border-radius:6px;}
.brand p{font-size:.75rem;color:var(--muted);}
.tcontrols{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.stat-pill{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);padding:5px 12px;border-radius:999px;font-size:.76rem;}
.tbtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:999px;font-size:.76rem;font-weight:600;cursor:pointer;}
.tbtn.blue{background:var(--accent);color:#fff;border-color:var(--accent);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;}
.dot.live{background:var(--green);box-shadow:0 0 7px var(--green);}
.search-wrap{position:relative;margin-bottom:14px;}
.search-in{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-size:.88rem;}
.search-res{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px;margin-top:6px;display:none;}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;min-width:142px;cursor:pointer;}
.chip.past{opacity:.45;}
.cdays{font-size:.98rem;font-weight:800;color:var(--accent);}
.cname{font-size:.78rem;font-weight:700;margin-top:2px;}
.cdate{font-size:.7rem;color:var(--muted);}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sec-h h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s;}
.mcard:hover{border-color:var(--accent);transform:translateY(-1px);}
.bar{height:7px;background:var(--card2);border-radius:999px;overflow:hidden;margin:10px 0 8px;}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .25s;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.tab{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
.item.done{opacity:.65;border-color:rgba(34,197,94,.4);}
.passes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.pbox{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:5px;font-size:.72rem;cursor:pointer;}
.pbox.on{border-color:var(--green);color:var(--green);font-weight:700;}
.tag{font-size:.68rem;font-weight:700;color:var(--accent);background:rgba(56,189,248,.14);padding:2px 7px;border-radius:6px;}
.star{background:none;border:none;font-size:1.05rem;cursor:pointer;color:var(--muted);}
.star.on{color:var(--amber);}
</style>
</head>
<body>

  <div class="topbar">
  <div class="brand">
    <h1>STUDY HUB WORKSPACE <span class="vtag">V7 SMART</span></h1>
    <p><span id="dot" class="dot"></span> <span id="syncTxt">Syncing...</span> · <span id="paceGlobal">Smart Engine Active</span></p>
  </div>
  <div class="tcontrols">
    <div class="stat-pill">
      <span>🔥 <b id="streakNum">1</b>d streak</span>
      <span>🎯 <b id="goalNum">0/5</b> today</span>
    </div>
    <button class="tbtn" id="themeBtn">☀️/🌙</button>
    <button class="tbtn" id="refreshBtn">↻</button>
    <button class="tbtn" id="impBtn">↑ Import</button>
    <button class="tbtn blue" id="expBtn">↓ Backup</button>
    <input type="file" id="impFile" accept=".json" style="display:none" />
  </div>
</div>

<div class="search-wrap">
  <input class="search-in" id="searchIn" placeholder="🔍 Global Search across all lectures, practicals, summaries & PDFs..." />
  <div class="search-res" id="searchRes"></div>
</div>

<div class="strip" id="cdStrip"></div>
<div id="viewRoot"></div>

<script>
const EXAMS = [
  { id:"ex1", mod:"mod_res", tab:"mid", name:"RES-233 Mid", date:"2026-12-06T09:00:00", label:"Sun, Dec 6" },
  { id:"ex2", mod:"mod_res", tab:"prac", name:"RES-233 Practical", date:"2026-12-19T09:00:00", label:"Sat, Dec 19" },
  { id:"ex3", mod:"mod_ele", tab:"lec", name:"ELE-235 Final", date:"2026-12-24T09:00:00", label:"Thu, Dec 24" },
  { id:"ex4", mod:"mod_bcs", tab:"lec", name:"BCS-234 Mid", date:"2027-01-03T09:00:00", label:"Sun, Jan 3" },
  { id:"ex5", mod:"mod_bcs", tab:"lec", name:"BCS-234 Practical", date:"2027-01-04T09:00:00", label:"Mon, Jan 4" },
  { id:"ex6", mod:"mod_res", tab:"lec", name:"RES-233 Final", date:"2027-01-10T09:00:00", label:"Sun, Jan 10" },
  { id:"ex7", mod:"mod_cvs", tab:"lec", name:"CVS-232 Final", date:"2027-01-17T09:00:00", label:"Sun, Jan 17" },
  { id:"ex8", mod:"mod_hps", tab:"lec", name:"HPS-231 Final", date:"2027-01-21T09:00:00", label:"Thu, Jan 21" }
];

  const RES_MID = [
  { day:"Day 1 · Fri Nov 27", items:[["Anatomy","1. Nasal cavity & paranasal sinus, nasopharynx, larynx"],["Anatomy","2. Anatomy of the lung"],["Anatomy","3. Tutorial 1 — trachea & bronchi"]]},
  { day:"Day 2 · Sat Nov 28", items:[["Histology","4. Histology of conducting parts of respiratory system"],["Physiology","5. Mechanics of ventilation"],["Physiology","6. Neural control of breathing"]]},
  { day:"Day 3 · Sun Nov 29", items:[["Physiology","7. Chemical control of breathing"],["Physiology","8. Gas exchange across the pulmonary membrane"]]},
  { day:"Day 4 · Mon Nov 30", items:[["Physiology","9. Oxygen transport in the blood"],["Physiology","10. Carbon dioxide transport in the blood"]]},
  { day:"Day 5 · Tue Dec 1", items:[["Biochem","11. Acid-base balance & anion gap"],["Biochem","12. Metabolic function of respiratory system"]]},
  { day:"Day 6 · Wed Dec 2", items:[["Pathology","13. Upper respiratory diseases (1)"],["Pathology","14. Upper respiratory diseases (2)"]]},
  { day:"Day 7 · Thu Dec 3", items:[["Micro","15. URTI — Group A beta-hemolytic strep, diphtheria"],["Micro","16. Bordetella pertussis, H. influenzae, Vincent angina"]]},
  { day:"Day 8 · Fri Dec 4", items:[["Micro","17. LRTI — Strep pneumoniae & Klebsiella pneumoniae"],["Micro","18. Mycobacterium tuberculosis"],["Pharm","19. Treatment of tuberculosis"]]},
  { day:"Day 9 · Sat Dec 5", items:[["Pharm","20. Treatment of viral & fungal chest infection"],["Review","21. Full pass: flashcards/MCQs on all 20 lectures, flag weak spots"]]}
];

const RES_PRAC = [
  ["Anatomy","P1: Bones of the thoracic cage"],["Anatomy","P2: Anatomy of intercostal space & diaphragm"],["Anatomy","P3: Nasal cavity, pharynx, larynx & trachea sagittal section"],["Anatomy","P4: Anatomy of the lung"],
  ["Histology","P1: Trachea, fetal lung and adult lung"],["Biochem","P1: Determination of pH"],
  ["Micro","P1: Streptococci, Diphtheria, B. anthracis, Y. pestis"],["Micro","P2: Mycobacterium tuberculosis, Klebsiella pneumoniae"],["Micro","P3: Diagnosis of viral & fungal RTI"],
  ["Para","P1: Echinococcus granulosus"],["Para","P2: Larvae affecting the lung"],
  ["Patho","P1: Non-neoplastic lesions of respiratory system"],["Patho","P2: Neoplastic lesions of respiratory system"],
  ["Pharma","P1: Effect of drugs on isolated guinea pig trachea"]
];
const MODS = [
  { id:"mod_res", code:"RES-233", folder:"res", name:"Respiratory System", exam:"2027-01-10", sub:"Mid: Dec 6 · Prac: Dec 19 · Final: Jan 10", staticGuides:[{title:"Respiratory Anatomy Guide",href:"anatomy.html"},{title:"Respiratory Histology Guide",href:"histology.html"}],
    items:[["Anatomy","L1: Nasal cavity, paranasal sinus, nasopharynx, larynx"],["Anatomy","L2: Anatomy of the lung"],["Anatomy","TUT1: Anatomy of pharynx, larynx & trachea"],["Anatomy","TUT2: Development & anomalies of respiratory system"],["Anatomy","TUT3: Anatomy of the pleura"],["Histology","L1: Histology of respiratory parts"],["Histology","L2: Histology of conducting parts"],["Biochem","L1: Acid base balance & anion gap"],["Biochem","TUT1: Bio-metabolic function of respiratory system"],["Biochem","TUT2: Lung surfactant & L/S ratio, Hb-O2 binding"],["Physiology","L1: Mechanics of breathing"],["Physiology","L2: Gas diffusion & regional blood flow"],["Physiology","L3: Chemical control of breathing"],["Physiology","L4: Neural control of breathing"],["Physiology","L5: Transport of CO2 in blood"],["Physiology","L6: Transport of O2 in blood"],["Physiology","TUT1: Pressure-volume relationship"],["Physiology","TUT2: Static lung volumes & capacities"],["Physiology","TUT3: Dynamic lung volumes & PFTs"],["Physiology","TUT4: Hypoxia and cyanosis"],["Physiology","TUT5: Special PFTs: MVV, FEV1"],["Micro","L1: URTI: Group A strep, Diphtheria"],["Micro","L2: Bordetella pertussis, H. influenzae, Vincent angina"],["Micro","L3: Mycobacterium tuberculosis"],["Micro","L4: LRTI: Strep & Klebsiella pneumoniae"],["Micro","L5: Viral RTI (1): Influenza, Parainfluenza"],["Micro","L6: Viral RTI (2): Rhino, Adeno, RSV, Corona"],["Micro","TUT1: Fungal: Histoplasma, Aspergillus"],["Para","L1: Paragonimiasis & house dust mites"],["Para","L2: Parasitic larva migrates to lungs"],["Pathology","L1: Upper respiratory diseases (1): nose & pharynx"],["Pathology","L2: Upper respiratory diseases (2): tonsil & larynx"],["Pathology","L3: Pathology of pulmonary microbial infection"],["Pathology","L4: Restrictive lung disease & ARDS"],["Pathology","L5: Chronic obstructive airway disease (1)"],["Pathology","L6: Chronic obstructive airway disease (2)"],["Pathology","L7: Pulmonary neoplasia"],["Pathology","L8: Pleural neoplasia"],["Pharma","L1: Treatment of tuberculosis"],["Pharma","L2: Principles of treatment of pulmonary infections"],["Pharma","L3: Viral & fungal chest infection treatment"],["Pharma","L4: Treatment of bronchial asthma"],["Pharma","TUT1: Therapeutic gases"],["Pharma","TUT2: Anti-cough therapy"],["Chest","CBL1: COPD (chest & pharma)"]] },
  { id:"mod_cvs", code:"CVS-232", folder:"cvs", name:"Cardiovascular System", exam:"2027-01-17", sub:"Final Exam: Sun, Jan 17, 2027 · 45 Topics", staticGuides:[],
    items:[["Anatomy","L1: Anatomy of mediastinum & pericardium"],["Anatomy","L2: External features of heart & vessels"],["Anatomy","L3: Internal features of the heart"],["Anatomy","L4: Development of heart & great vessels"],["Anatomy","L5: Anomalies of heart & great vessels"],["Anatomy","TUT: Anatomy of heart & great vessels"],["Histology","L1: Histology of heart & blood vessels"],["Histology","TUT: Histology of special vessels"],["Biochem","L1: Cholesterol structure & metabolism"],["Biochem","L2: Plasma lipoproteins"],["Biochem","TUT: Hypo & hyperlipoproteinemia"],["Physiology","L1: Overview on CVS"],["Physiology","L2: Cardiac properties I"],["Physiology","L3: Cardiac properties II"],["Physiology","L4: Cardiac cycle I"],["Physiology","L5: Cardiac cycle II"],["Physiology","L6: Control of COP"],["Physiology","L7: Physiological variation of ABP"],["Physiology","L8: Regulation of ABP I"],["Physiology","L9: Electrical activity of heart & ECG I"],["Physiology","L10: Electrical activity of heart & ECG II"],["Physiology","L11: Regulation of ABP II"],["Physiology","L12: Capillary circulation & edema"],["Physiology","L13: Venous & lymphatic circulation"],["Physiology","L14: Special circulations: coronary, cerebral, pulmonary"],["Pathology","L1: HTN & effect on CVS"],["Pathology","L2: Ischemic heart diseases"],["Pathology","L3: Rh HD & infective endocarditis"],["Pathology","L4: Myocardial & pericardial disease"],["Pathology","TUT1: Atherosclerosis & aneurysm"],["Pathology","TUT2: Valvular & rheumatic heart disease"],["Pathology","TUT3: Vasculitis & CV Tumors"],["Pharma","L1: Anti-arrhythmic drugs I"],["Pharma","L2: Anti-arrhythmic drugs II"],["Pharma","L3: Antihypertensive drugs I"],["Pharma","L4: Antihypertensive drugs II"],["Pharma","L5: Drugs used in heart failure"],["Pharma","L6: Anti-anginal drugs"],["Pharma","L7: Hypo-lipidemic drugs"],["Pharma","TUT1: Pharmacology treatment of shock"],["Cardiology","L1: Cardiac arrhythmias I"],["Cardiology","L2: Cardiac arrhythmias II"],["Cardiology","CBL1: Cardiac arrhythmias"],["Cardiology","CBL2: Circulatory shock"],["Cardiology","CBL3: Heart failure"]] },
  { id:"mod_hps", code:"HPS-231", folder:"hps", name:"Hematopoietic System", exam:"2027-01-21", sub:"Final Exam: Thu, Jan 21, 2027 · 24 Topics", staticGuides:[],
    items:[["Anatomy","L1: Anatomy of lymphatic system"],["Histology","L1: Histology of Blood Cells & Platelets"],["Histology","L2: Histology of lymphatic system I"],["Histology","L3: Histology of lymphatic system II"],["Biochem","L1: RBC metabolism & Haem-synthesis"],["Biochem","L2: Heme catabolism"],["Biochem","CBL: G6PD deficiency (Favism)"],["Physiology","L1: Physiology of RBCs & Hb"],["Physiology","L2: Anemia & Polycythemia"],["Physiology","L3: Hemostasis I"],["Physiology","L4: Hemostasis II"],["Physiology","TUT: Plasma & plasma proteins"],["Physiology","CBL: Iron deficiency Anemia"],["Pathology","L1: Non-neoplastic LN enlargement"],["Pathology","L2: Neoplastic LN enlargement"],["Pathology","TUT: Splenic Mass & cyst"],["Pathology","CBL: Case of lymphadenopathy"],["Pharma","L1: Treatment of anemia"],["Pharma","L2: Anticoagulants"],["Micro","L1: Bacteremia, Typhoid fever"],["Micro","L2: Parvo virus, EBV & Hemorrhagic fevers"],["Micro","TUT: Brucella, Yersinia, Rickettsia & Q fever"],["Para","L1: Malaria"],["Para","L2: Lymphatic filariasis"]] },
  { id:"mod_bcs", code:"BCS-234", folder:"bcs", name:"Basic Clinical Skills", exam:"2027-01-03", sub:"Mid: Jan 3 · Practical: Jan 4–5, 2027", staticGuides:[], items:[] },
  { id:"mod_ele", code:"ELE-235", folder:"ele", name:"Elective Course", exam:"2026-12-24", sub:"Final Exam: Thu, Dec 24, 2026", staticGuides:[], items:[] }
];
let store = JSON.parse(localStorage.getItem("v7_hub") || "{}");
store.checks = store.checks || {}; store.stars = store.stars || {}; store.mid = store.mid || {}; store.prac = store.prac || {}; store.custom = store.custom || {}; store.pdfs = store.pdfs || {};
let curMod = null, curTab = "lec", filter = "All", cram = false, autoFiles = {}, saveCloud = null;

if (store.light) document.documentElement.classList.add("light");
document.getElementById("themeBtn").onclick = () => { document.documentElement.classList.toggle("light"); store.light = document.documentElement.classList.contains("light"); persist(); };
document.getElementById("refreshBtn").onclick = () => location.reload();

function persist() { localStorage.setItem("v7_hub", JSON.stringify(store)); if (saveCloud) saveCloud(store); render(); }
function daysTo(d) { return Math.max(1, Math.ceil((new Date(d) - Date.now()) / 86400000)); }
function getItems(m) { return [...m.items.map((x,i)=>({id:`${m.id}_${i}`,num:String(i+1).padStart(2,"0"),dept:x,text:x})), ...(store.custom[m.id]||[])]; }

function renderStrip() {
  const now = Date.now();
  document.getElementById("cdStrip").innerHTML = EXAMS.map(e => {
    const ms = new Date(e.date).getTime() - now;
    const d = Math.ceil(ms / 86400000);
    return `<div class="chip ${ms<=0?'past':''}" onclick="openMod('${e.mod}','${e.tab}')"><div class="cdays">${ms<=0?'Done':d+'d left'}</div><div class="cname">${e.name}</div><div class="cdate">${e.label}</div></div>`;
  }).join("");
}

function render() {
  renderStrip();
  const root = document.getElementById("viewRoot");
  const todayStr = new Date().toISOString().slice(0,10);
  const doneToday = Object.values(store.checks).filter(v => v === todayStr).length + Object.values(store.mid).filter(v => v === todayStr).length;
  document.getElementById("goalNum").textContent = `${doneToday}/5`;

  if (!curMod) {
    const dueMid = [];
    RES_MID.forEach((d,di) => d.items.forEach((it,ii) => { const k=`d${di}-i${ii}`; if(!store.mid[k] && dueMid.length<3) dueMid.push({k,dept:it,text:it,src:"RES Mid"}); }));
    const weak = [];
    MODS.forEach(m => getItems(m).forEach(it => { if(store.stars[it.id] && weak.length<3) weak.push({id:it.id,mod:m.id,dept:it.dept,text:`#${it.num} ${it.text}`,src:m.code}); }));

    const cards = MODS.map(m => {
      const its = getItems(m);
      const done = its.filter(it => store.checks[it.id+"_p1"]).length;
      const left = its.length - done;
      const pace = its.length ? (left / daysTo(m.exam)).toFixed(1) : "0.0";
      const pct = its.length ? Math.round((done/its.length)*100) : 0;
      return `<div class="mcard" onclick="openMod('${m.id}','${m.id==='mod_res'?'mid':'lec'}')">
        <div style="display:flex;justify-content:space-between;align-items:center;"><span class="tag">${m.code}</span><span style="font-size:.75rem;color:var(--accent);font-weight:700;">⚡ ${pace}/day</span></div>
        <h3 style="font-size:1.05rem;margin:6px 0 2px;">${m.name}</h3>
        <div style="font-size:.76rem;color:var(--muted);">${m.sub}</div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;"><span style="color:var(--green);">${done} Finished</span><span style="color:var(--muted);">${left} Left (${pct}%)</span></div>
      </div>`;
    }).join("");

    root.innerHTML = `<div class="card">
      <div class="sec-h"><h2>🎯 Smart Today's Plan</h2><span class="tag">Auto-Curated</span></div>
      ${dueMid.map(x=>`<div class="item" style="display:flex;align-items:center;gap:10px;"><input type="checkbox" onchange="toggleMid('${x.k}')"><span class="tag">${x.src}</span><span style="flex:1;font-size:.86rem;">${x.text}</span></div>`).join("")}
      ${weak.map(x=>`<div class="item" onclick="openMod('${x.mod}','lec')" style="cursor:pointer;display:flex;align-items:center;gap:8px;"><span style="color:var(--amber);">★</span><span class="tag">${x.src}</span><span style="font-size:.86rem;">${x.text}</span></div>`).join("")}
      ${(!dueMid.length && !weak.length)?'<p style="font-size:.84rem;color:var(--muted);">All caught up for today! Tap any module below to continue.</p>':''}
    </div>
    <div class="sec-h"><h2>Modules (Separate Tracking)</h2></div>
    <div class="grid">${cards}</div>`;
    return;
  }
  const m = MODS.find(x => x.id === curMod);
  const its = getItems(m);
  const done = its.filter(it => store.checks[it.id+"_p1"]).length;
  const left = its.length - done;
  const pace = its.length ? (left / daysTo(m.exam)).toFixed(1) : "0.0";

  let modTabs = `<button class="tab ${curTab==='lec'?'on':''}" onclick="setTab('lec')">Finals Lectures (${its.length})</button>`;
  if (m.id === "mod_res") modTabs += `<button class="tab ${curTab==='mid'?'on':''}" onclick="setTab('mid')">Midterm Plan (21)</button><button class="tab ${curTab==='prac'?'on':''}" onclick="setTab('prac')">Practical 14-List</button>`;
  modTabs += `<button class="tab ${curTab==='res'?'on':''}" onclick="setTab('res')">Guides, Summaries & PDFs</button>`;

  let bodyHtml = "";
  if (curTab === "lec") {
    const depts = ["All", "Remaining", "Weak ★", ...new Set(its.map(x=>x.dept))];
    const fBar = depts.map(d => `<button class="tab ${filter===d?'on':''}" onclick="setFilter('${d}')">${d}</button>`).join("");
    const shown = its.filter(it => {
      if (cram && !store.stars[it.id]) return false;
      if (filter === "Remaining") return !store.checks[it.id+"_p1"];
      if (filter === "Weak ★") return Boolean(store.stars[it.id]);
      if (filter !== "All") return it.dept === filter;
      return true;
    });
    bodyHtml = `<div class="tabs">${fBar}</div>
    <form onsubmit="addTopic(event)" style="display:flex;gap:6px;margin-bottom:12px;">
      <input id="newDept" placeholder="Subject" style="width:105px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:10px;font-size:.82rem;" required>
      <input id="newTxt" placeholder="Add lecture title..." style="flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:10px;font-size:.82rem;" required>
      <button class="tbtn blue" type="submit">+ Add</button>
    </form>
    ${shown.map(it => {
      const p1 = Boolean(store.checks[it.id+"_p1"]);
      const boxes = [["p1","1st Study"],["p2","Rev 1"],["p3","Rev 2"],["p4","Qs"]].map(p => {
        const k = `${it.id}_${p}`; const on = Boolean(store.checks[k]);
        return `<div class="pbox ${on?'on':''}" onclick="toggleChk('${k}')">${on?'✓ ':''}${p}</div>`;
      }).join("");
      return `<div class="item ${p1?'done':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div><span class="tag">#${it.num} · ${it.dept}</span> <span style="font-size:.9rem;font-weight:600;">${it.text}</span></div>
          <button class="star ${store.stars[it.id]?'on':''}" onclick="toggleStar('${it.id}')">★</button>
        </div>
        <div class="passes">${boxes}</div>
      </div>`;
    }).join("")}`;
  } else if (curTab === "mid") {
    bodyHtml = RES_MID.map((d,di) => `<div class="card"><div class="sec-h"><h2>${d.day}</h2></div>${d.items.map((it,ii)=>{
      const k=`d${di}-i${ii}`; const on=Boolean(store.mid[k]);
      return `<div class="item ${on?'done':''}" style="display:flex;align-items:center;gap:10px;"><input type="checkbox" ${on?'checked':''} onchange="toggleMid('${k}')"><span class="tag">${it}</span><span style="font-size:.88rem;">${it}</span></div>`;
    }).join("")}</div>`).join("");
  } else if (curTab === "prac") {
    bodyHtml = RES_PRAC.map((it,i) => {
      const boxes = [["p1","1st Study"],["p2","Rev 1"],["p3","Rev 2"],["p4","Qs"]].map(p => {
        const k = `pr_${i}_${p}`; const on = Boolean(store.prac[k]);
        return `<div class="pbox ${on?'on':''}" onclick="togglePrac('${k}')">${on?'✓ ':''}${p}</div>`;
      }).join("");
      return `<div class="item"><span class="tag">#P${String(i+1).padStart(2,"0")} · ${it}</span> <b style="font-size:.9rem;">${it}</b><div class="passes">${boxes}</div></div>`;
    }).join("");
  } else {
    const autoPdfs = autoFiles[`pdfs/${m.folder}`] || [];
    const autoGuides = autoFiles[`guides/${m.folder}`] || [];
    const savedPdfs = store.pdfs[m.id] || [];
    bodyHtml = `<div class="card"><div class="sec-h"><h2>Interactive HTML Guides</h2></div>
      ${[...m.staticGuides, ...autoGuides].map(g=>`<a href="${g.href}" class="item" style="display:block;text-decoration:none;color:var(--accent);font-weight:700;">✨ ${g.title} →</a>`).join("") || '<p style="font-size:.82rem;color:var(--muted);">Upload daily HTML guides to <b>guides/'+m.folder+'/</b> on GitHub to appear here automatically.</p>'}
    </div>
    <div class="card"><div class="sec-h"><h2>Original Lecture PDFs</h2></div>
      <form onsubmit="addPdf(event)" style="display:flex;gap:6px;margin-bottom:10px;">
        <input id="pdfTitle" placeholder="PDF Title" style="width:130px;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:10px;font-size:.82rem;" required>
        <input id="pdfUrl" placeholder="Filename (e.g. ecg.pdf) or Drive link" style="flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:10px;font-size:.82rem;" required>
        <button class="tbtn blue" type="submit">+ Link</button>
      </form>
      ${[...autoPdfs, ...savedPdfs].map(p=>`<a href="${p.href}" target="_blank" class="item" style="display:block;text-decoration:none;color:var(--text);font-weight:600;">📄 ${p.title} ↗</a>`).join("") || '<p style="font-size:.82rem;color:var(--muted);">Bulk-upload PDFs into <b>pdfs/'+m.folder+'/</b> on GitHub or paste a link above.</p>'}
    </div>`;
  }

  root.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <button class="tbtn" onclick="curMod=null;cram=false;render()">← Study Hub</button>
    <button class="tbtn ${cram?'blue':''}" onclick="cram=!cram;render()">⚡ Exam-Eve Cram Mode: ${cram?'ON':'OFF'}</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;"><span class="tag">${m.code}</span><span style="font-size:.8rem;color:var(--accent);font-weight:700;">⚡ ${pace} topics/day needed</span></div>
    <h2 style="margin:6px 0 2px;">${m.name}</h2>
    <p style="font-size:.8rem;color:var(--muted);">${m.sub}</p>
    <div class="bar"><div class="fill" style="width:${its.length?Math.round((done/its.length)*100):0}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;"><span style="color:var(--green);">✅ ${done} Finished</span><span>⏳ ${left} Left</span></div>
  </div>
  <div class="tabs">${modTabs}</div>${bodyHtml}`;
}

window.openMod = (id, tab) => { curMod = id; curTab = tab || "lec"; filter = "All"; cram = false; render(); scanRepo(MODS.find(x=>x.id===id).folder); };
window.setTab = (t) => { curTab = t; render(); };
window.setFilter = (f) => { filter = f; render(); };
window.toggleChk = (k) => { store.checks[k] = store.checks[k] ? false : new Date().toISOString().slice(0,10); persist(); };
window.toggleStar = (id) => { store.stars[id] = !store.stars[id]; persist(); };
window.toggleMid = (k) => { store.mid[k] = store.mid[k] ? false : new Date().toISOString().slice(0,10); persist(); };
window.togglePrac = (k) => { store.prac[k] = !store.prac[k]; persist(); };
window.addTopic = (e) => { e.preventDefault(); const m = MODS.find(x=>x.id===curMod); store.custom[m.id] = store.custom[m.id] || []; const num = String(getItems(m).length+1).padStart(2,"0"); store.custom[m.id].push({id:`c_${Date.now()}`,num,dept:document.getElementById("newDept").value,text:document.getElementById("newTxt").value}); persist(); };
window.addPdf = (e) => { e.preventDefault(); store.pdfs[curMod] = store.pdfs[curMod] || []; store.pdfs[curMod].push({title:document.getElementById("pdfTitle").value,href:document.getElementById("pdfUrl").value}); persist(); };

document.getElementById("searchIn").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  const box = document.getElementById("searchRes");
  if (!q) { box.style.display = "none"; return; }
  const hits = [];
  MODS.forEach(m => getItems(m).forEach(it => { if ((it.text+it.dept+it.num).toLowerCase().includes(q)) hits.push(`<div style="padding:6px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.82rem;" onclick="openMod('${m.id}','lec')"><b>${m.code} #${it.num}</b> · ${it.text}</div>`); }));
  box.innerHTML = hits.slice(0,8).join("") || '<div style="font-size:.8rem;color:var(--muted);">No matches found</div>';
  box.style.display = "block";
});

document.getElementById("expBtn").onclick = () => { const a = document.createElement("a"); a.href = "data:application/json," + encodeURIComponent(JSON.stringify(store)); a.download = "study-hub-backup.json"; a.click(); };
document.getElementById("impBtn").onclick = () => document.getElementById("impFile").click();
document.getElementById("impFile").onchange = e => { const r = new FileReader(); r.onload = () => { store = JSON.parse(r.result); persist(); }; r.readAsText(e.target.files); };

async function scanRepo(folder) {
  const api = location.protocol + "//" + ["api","github","com"].join(".") + "/repos/omar200008/Uni-Studying/contents/";
  for (const kind of ["pdfs","guides"]) {
    try {
      const res = await fetch(api + kind + "/" + folder);
      if (res.ok) { const arr = await res.json(); autoFiles[`${kind}/${folder}`] = arr.filter(f=>f.type==="file").map(f=>({title:f.name.replace(/\.[^.]+$/,""),href:`${kind}/${folder}/${f.name}`})); render(); }
    } catch(e) {}
  }
}

render();
